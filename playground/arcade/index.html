<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>XNT: Two-Player Arcade</title>
    <meta name="description" content="Two-player arcade games. Play a bot or a friend." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="assets/images/icon-192.png" />
    <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png" />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/animations.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/stage.css?v=2" />
    <link rel="stylesheet" href="css/games.css" />
  </head>
  <body>
    <header class="nav">
      <a class="logo" href="#" aria-label="XNT home">
        <svg class="mascot" viewBox="0 0 100 64" aria-hidden="true">
          <path class="speed" d="M2 20h18M6 32h16M2 44h18"/>
          <path class="pac" d="M56 32 75.7 18.2A24 24 0 1 0 75.7 45.8Z"/>
          <circle class="eye" cx="58" cy="24" r="3"/>
          <path class="brow" d="M50 17.5 65 23.5"/>
          <rect class="px" x="84" y="25" width="5" height="5"/><rect class="px" x="91" y="32" width="5" height="5"/><rect class="px" x="84" y="38" width="5" height="5"/>
        </svg>
        <span class="logo-text"><i>X</i>NT</span>
      </a>
      <div class="nav-right">
        <button class="stats-btn icon-btn" id="muteBtn"></button>
        <button class="stats-btn" id="statsBtn"><span id="navStats">0 W · 0 L</span></button>
      </div>
    </header>

    <main class="wrap">
      <p class="intro">
        XNT is a free arcade of two-player games. Pick one, then beat a bot on
        Easy, Medium, Hard or Ragebait, or pass the keyboard to a friend.
        Ragebait is built to beat you, so good luck. Sound starts after your
        first click. The speaker button mutes it.
      </p>
      <div class="tabs" id="filters"></div>
      <div class="tiles" id="tiles"></div>
    </main>

    <!-- Setup modal -->
    <div class="modal" id="setup" hidden>
      <div class="sheet">
        <button class="x" data-close aria-label="Close"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        <h3 id="setupTitle"></h3>
        <div class="seg" id="modeSeg">
          <button class="active" data-mode="bot">vs Bot</button>
          <button data-mode="friend">vs Friend</button>
        </div>
        <div class="seg" id="diffSeg">
          <button data-diff="easy">Easy</button>
          <button class="active" data-diff="medium">Medium</button>
          <button data-diff="hard">Hard</button>
          <button data-diff="ragebait">Ragebait</button>
        </div>
        <div class="names">
          <label>Player 1<input id="n1" maxlength="12" placeholder="You" /></label>
          <label id="n2wrap" hidden>Player 2<input id="n2" maxlength="12" placeholder="Friend" /></label>
        </div>
        <p class="controls" id="setupControls"></p>
        <button class="btn primary wide" id="startBtn">Start</button>
      </div>
    </div>

    <!-- Stage -->
    <div class="stage" id="stage" hidden>
      <div class="stage-top">
        <button class="btn ghost sm" id="backBtn">Back</button>
        <div class="scorebar">
          <div class="who p0"><span id="nm0">You</span></div>
          <div class="score"><b id="sc0">0</b><i>:</i><b id="sc1">0</b></div>
          <div class="who p1"><span id="nm1">Bot</span></div>
        </div>
        <div class="stage-title" id="stageTitle"></div>
      </div>
      <div class="status" id="status"></div>
      <div class="arena" id="arena"></div>
      <div class="result" id="result" hidden>
        <div class="result-card">
          <h2 id="rTitle"></h2>
          <div class="r-laugh" id="rLaugh"></div>
          <p class="muted" id="rSub"></p>
          <div class="row-btns">
            <button class="btn primary" id="rematch">Again</button>
            <button class="btn ghost" id="toLobby">Games</button>
          </div>
        </div>
      </div>
    </div>

    <div class="modal" id="statsModal" hidden>
      <div class="sheet">
        <button class="x" data-close aria-label="Close"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        <h3>Record</h3>
        <div class="statgrid" id="statGrid"></div>
        <button class="btn ghost wide" id="resetStats">Reset</button>
      </div>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/icons.js"></script>
    <script src="js/stats.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/games/tictactoe.js"></script>
    <script src="js/games/connect4.js"></script>
    <script src="js/games/rps.js"></script>
    <script src="js/games/coin.js"></script>
    <script src="js/games/quickdraw.js"></script>
    <script src="js/games/pong.js"></script>
    <script src="js/games/reversi.js"></script>
    <script src="js/games/dots.js"></script>
    <script src="js/games/memory.js"></script>
    <script src="js/games/hockey.js"></script>
    <script src="js/games/tug.js"></script>
    <script src="js/games/dice.js"></script>
    <script src="js/maze.js"></script>
    <script src="js/games/gomoku.js"></script>
    <script src="js/games/nim.js"></script>
    <script src="js/games/hilo.js"></script>
    <script src="js/games/blackjack.js"></script>
    <script src="js/games/checkers.js"></script>
    <script src="js/games/battleship.js"></script>
    <script src="js/games/snake.js"></script>
    <script src="js/games/pacman.js"></script>
    <script src="js/games/whack.js"></script>
    <script src="js/games/ctf.js"></script>
    <script src="js/games/golf.js"></script>
    <script src="js/data.js"></script>
    <script src="js/lobby.js"></script>
    <script src="js/setup.js"></script>
    <script src="js/stage.js?v=2"></script>
    <script src="js/main.js"></script>
  </body>
</html>
